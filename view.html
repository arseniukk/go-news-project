<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{.Title}} | NewsPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; line-height: 1.6; background: #f9fafb; margin: 0; }
        .container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .category { color: #4f46e5; font-weight: 700; text-transform: uppercase; font-size: 14px; }
        h1 { font-size: 36px; margin: 10px 0; letter-spacing: -1px; }
        .meta { color: #6b7280; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        p { font-size: 18px; color: #374151; }
        .back { display: inline-block; margin-top: 40px; text-decoration: none; color: #4f46e5; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
    <img src="{{.ImageURL}}" style="width: 100%; height: 350px; object-fit: cover; border-radius: 20px; margin-bottom: 25px;">
    <span class="category">{{.Category}}</span>
    <h1>{{.Title}}</h1>
    <div class="meta">Опубліковано: {{.Date}} | 👁 Переглядів: {{.Views}}</div>
    <p>{{.Content}}</p>
    <a href="/" class="back">← Назад до списку новин</a>
</div>
</body>
</html>
